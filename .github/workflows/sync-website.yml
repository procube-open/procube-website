name: Sync Website to Sakura Server

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_SERVER_FQDN }}" >> ~/.ssh/known_hosts

      - name: Sync www/ to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa" \
            www/ \
            "${{ secrets.SSH_SERVER_ACCOUNT }}@${{ secrets.SSH_SERVER_FQDN }}:~/www/"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa
