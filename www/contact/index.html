  <body>
    <!--#include virtual="/assets/inc/header.html" -->
    <main class="l-main js-main" data-page="contact">
      <div class="l-main__inner">
        <section class="l-mainBand">
          <div class="l-mainBand__inner">
            <h1 class="c-title01">
              <span class="c-title01__main"><span class="c-title01__mainAccent01">CONTACT</span></span>
              <span class="c-title01__sub"><span class="c-title01__subText">お問い合わせ</span></span>
            </h1>
          </div>
          <div class="l-breadcrumb">
            <div class="l-breadcrumb__inner">
              <div class="l-breadcrumb__wrap">
                <ul class="l-breadcrumb__list">
                  <li class="l-breadcrumb__item">
                    <a href="/" class="l-breadcrumb__link">HOME</a>
                  </li>
                  <li class="l-breadcrumb__item">
                    <span class="l-breadcrumb__text">お問い合わせ</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </section>
        <!-- /.l-mainBand -->
        <div class="l-mainBody--spaceBottom">
          <section class="l-mainSection">
            <div class="l-mainSection__inner">
              <div class="l-mainSection__wrap">
                <h2 class="c-title02" data-position="center">
                  <span class="c-title02__read">CONTACT</span>
                  <span class="c-title02__text">お問い合わせ</span>
                </h2>
                <div class="p-contactBoard">
                  <p class="p-contactBoard__title">お電話でのお問い合わせ</p>
                  <div class="p-contactBoard__detail">
                    <p class="p-contactBoard__tel">TEL：<a href="tel:0783931334" class="p-contactBoard__telLink">078-393-1334</a></p>
                    <p class="p-contactBoard__read">お電話でのお問い合わせは、平日の9：00～17：00で承っております。</p>
                  </div>
                </div>
                <div class="p-contactSign">
                  <div class="p-contactSignStep">
                    <ul class="p-contactSignStep__list">
                      <li class="p-contactSignStep__item" data-step="on">
                        <img src="/assets/img/contact/icon_step01_on.svg" class="p-contactSignStep__icon" alt="STEP01" width="72" height="72" loading="lazy">
                      </li>
                      <li class="p-contactSignStep__item" data-step="off">
                        <img src="/assets/img/contact/icon_step02_off.svg" class="p-contactSignStep__icon" alt="STEP02" width="72" height="72" loading="lazy">
                      </li>
                      <li class="p-contactSignStep__item" data-step="off">
                        <img src="/assets/img/contact/icon_step03_off.svg" class="p-contactSignStep__icon" alt="STEP03" width="72" height="72" loading="lazy">
                      </li>
                    </ul>
                  </div>
                  <div class="p-contactSign__detail">
                    <p class="p-contactSign__text">下記のフォームに必要事項をご記入のうえ、「入力内容を確認する」ボタンを押してください。<br>お問い合わせ頂きました内容を確認後、担当よりご連絡させて頂きます。</p>
                  </div>
                </div>
                <form class="p-contactForm" action="contact.py">
                  <table class="p-contactFormTable">
                    <colgroup>
                      <col style="width: 29.09%;">
                      <col>
                    </colgroup>
                    <tbody>
                      <tr>
                        <th>
                          <p class="p-contactForm__label">お問い合わせの項目<span class="p-contactForm__labelBadge">必須</span></p>
                        </th>
                        <td>
                          <div class="c-formRadio01">
                            <ul class="c-formRadio01__list">
                              <li class="c-formRadio01__item">
                                <label class="c-formRadio01__label">
                                  <input type="radio" class="c-formRadio01__input" name="kind" value="製品について">
                                  <span class="c-formRadio01__text">製品について</span>
                                </label>
                              </li>
                              <li class="c-formRadio01__item">
                                <label class="c-formRadio01__label">
                                  <input type="radio" class="c-formRadio01__input" name="kind" value="採用について">
                                  <span class="c-formRadio01__text">採用について</span>
                                </label>
                              </li>
                              <li class="c-formRadio01__item">
                                <label class="c-formRadio01__label">
                                  <input type="radio" class="c-formRadio01__input" name="kind" value="その他">
                                  <span class="c-formRadio01__text">その他</span>
                                </label>
                              </li>
                            </ul>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <th>
                          <p class="p-contactForm__label">御社名<span class="p-contactForm__labelBadge">必須</span></p>
                        </th>
                        <td>
                          <div class="c-formText01">
                            <input type="text" name="company" class="c-formText01__input" data-width="640" data-alert="off" placeholder="例：株式会社プロキューブ" required>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <th>
                          <p class="p-contactForm__label">氏名<span class="p-contactForm__labelBadge">必須</span></p>
                        </th>
                        <td>
                          <div class="c-formText01">
                            <input type="text" name="name" class="c-formText01__input" data-width="308" data-alert="off" placeholder="例：山田　太郎" required>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <th>
                          <p class="p-contactForm__label">電話番号<span class="p-contactForm__labelBadge">必須</span></p>
                        </th>
                        <td>
                          <div class="c-formText01">
                            <input type="text" name="tel" class="c-formText01__input" data-width="308" data-alert="off" placeholder="例：078-393-1334" required>
                            <span class="c-formText01__note">（半角数字）</span>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <th>
                          <p class="p-contactForm__label">メールアドレス<span class="p-contactForm__labelBadge">必須</span></p>
                        </th>
                        <td>
                          <div class="c-formText01">
                            <input type="text" name="email" class="c-formText01__input" data-width="536" data-alert="off" placeholder="例：test@example.co.jp" required>
                            <span class="c-formText01__note">（半角数字）</span>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <th>
                          <p class="p-contactForm__label">メールアドレス（確認用）<span class="p-contactForm__labelBadge">必須</span></p>
                        </th>
                        <td>
                          <div class="c-formText01">
                            <input type="text" name="email2" class="c-formText01__input" data-width="536" data-alert="off" placeholder="例：test@example.co.jp" required>
                            <span class="c-formText01__note">（半角数字）</span>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <th>
                          <p class="p-contactForm__label">ご質問・ご相談内容<span class="p-contactForm__labelBadge">必須</span></p>
                        </th>
                        <td>
                          <div class="c-formSentence01">
                            <textarea name="comment" id="inquiry01" class="c-formSentence01__textarea" data-width="640" data-alert="off" placeholder="ご質問・ご相談内容を入力してください" required></textarea>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                  <div class="p-contactInduction">
                    <div class="p-contactInduction__item">
                      <div class="c-btn01">
                        <button class="c-btn01__link" type="submit"><span class="c-btn01__text">入力内容を確認する</span></button>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
              <!-- /.l-mainSection__wrap -->

    <!-- /.l-main -->

    <!--#include virtual="/assets/inc/footer-js.html" -->

    <script>
$(function() {
  const $form = $('.p-contactForm');
  $form.on('submit', function(event) {
    let errors = [];

    // 1. お問い合わせの項目（ラジオボタン）
    if (!$('input[name="kind"]:checked').val()) {
      errors.push("「お問い合わせの項目」を選択してください。");
    }

    // 2. テキスト入力・テキストエリアの必須チェック
    // 判定対象：御社名, 氏名, 電話番号, メールアドレス, メールアドレス確認, 内容
    const requiredFields = [
      { name: 'company', label: '御社名' },
      { name: 'name',    label: '氏名' },
      { name: 'tel',     label: '電話番号' },
      { name: 'email',   label: 'メールアドレス' },
      { name: 'email2',  label: 'メールアドレス（確認用）' },
      { name: 'comment', label: 'ご質問・ご相談内容' }
    ];

    $.each(requiredFields, function(index, field) {
      const $input = $(`[name="${field.name}"]`);
      // trim()で空白のみの入力もエラーにする
      if ($.trim($input.val()) === "") {
        errors.push(`「${field.label}」を入力してください。`);
      }
    });

    // 3. メールアドレスの一致チェック
    const email = $('input[name="email"]').val();
    const email2 = $('input[name="email2"]').val();

    if (email && email2 && email !== email2) {
      errors.push("メールアドレスが一致しません。再度ご確認ください。");
    }

    // エラーがある場合はアラートを表示して送信を中止
    if (errors.length > 0) {
      event.preventDefault();
      alert(errors.join('\n'));
    }
  });
});
    </script>

  </body>
</html>
